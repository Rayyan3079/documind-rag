name: Eval

# Paid run: answers 26 questions with Claude, judges them, and screenshots the UI.
# Uses the ANTHROPIC_API_KEY repository secret and commits the results back to the branch.
on:
  workflow_dispatch:
  push:
    branches: [claude/laughing-feynman-llr4hj]
    paths:
      - .github/workflows/eval.yml
      - documind/**
      - eval/run_eval.py
      - eval/questions.jsonl
      - scripts/screenshot.py

concurrency:
  group: eval-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  eval:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install -e ".[dev]" playwright
          playwright install --with-deps chromium

      - name: Check API key
        run: test -n "$ANTHROPIC_API_KEY" || { echo "ANTHROPIC_API_KEY secret is not set"; exit 1; }

      - name: Download corpus
        run: python scripts/download_docs.py

      - name: Build index
        run: python -m documind ingest

      - name: Smoke test
        run: python -m documind ask "What input voltage range is allowed on the Pico's VSYS pin?"

      - name: Run evaluation
        run: python eval/run_eval.py

      - name: Screenshot the UI
        run: python scripts/screenshot.py

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: eval-results
          path: |
            eval/results/
            docs/screenshot.png
          if-no-files-found: ignore

      - name: Commit results
        run: |
          git config user.name "Rayyan Laeeq"
          git config user.email "rayyanlaeeq@gmail.com"
          git add eval/results docs/screenshot.png
          git diff --cached --quiet && exit 0
          git commit -m "Add evaluation results and UI screenshot"
          git push origin HEAD:${{ github.ref_name }}
