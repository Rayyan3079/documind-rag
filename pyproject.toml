[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "documind"
version = "0.1.0"
description = "Retrieval-augmented Q&A over technical PDF manuals, with page-level citations and a built-in evaluation."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Rayyan Laeeq" }]
dependencies = [
    "anthropic>=2.3,<3",
    "pypdf>=6.0",
    "sentence-transformers>=5.0",
    "chromadb>=1.0",
    "rank-bm25>=0.2.2",
    "typer>=0.12",
    "fastapi>=0.110",
    "uvicorn>=0.29",
    "python-multipart>=0.0.9",
    "streamlit>=1.35",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "httpx>=0.27"]

[project.scripts]
documind = "documind.cli:app"

[tool.setuptools.packages.find]
include = ["documind*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
